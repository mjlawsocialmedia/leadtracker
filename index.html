<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lead Register — Law Chambers of Mridul Jindal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #F7F4EE; }
  * { box-sizing: border-box; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:translateY(0);} }
  .row-enter { animation: slideUp 0.25s ease; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #7C6A52; outline-offset: 1px; }
  button:focus-visible { outline: 2px solid #7C6A52; outline-offset: 2px; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---- Change this password before publishing ----
const SITE_PASSWORD = "changeme123";
// --------------------------------------------------

function Gate({ onUnlock }) {
  const [input, setInput] = useState("");
  const [error, setError] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (input === SITE_PASSWORD) {
      sessionStorage.setItem("mj_unlocked", "true");
      onUnlock();
    } else {
      setError(true);
    }
  }

  return (
    <div style={gateStyles.wrap}>
      <form style={gateStyles.box} onSubmit={handleSubmit}>
        <div style={gateStyles.kicker}>Law Chambers of Mridul Jindal</div>
        <h1 style={gateStyles.h1}>Lead Register</h1>
        <p style={gateStyles.sub}>Enter the password to continue</p>
        <input
          type="password"
          autoFocus
          style={gateStyles.input}
          value={input}
          onChange={(e) => { setInput(e.target.value); setError(false); }}
          placeholder="Password"
        />
        {error && <div style={gateStyles.error}>Incorrect password. Try again.</div>}
        <button type="submit" style={gateStyles.btn}>Unlock</button>
      </form>
    </div>
  );
}

const gateStyles = {
  wrap: { minHeight: "100vh", background: "#F7F4EE", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Inter', sans-serif", padding: 20 },
  box: { background: "#fff", border: "1px solid #E8E1D3", borderRadius: 14, padding: "32px 28px", width: "100%", maxWidth: 340, textAlign: "center" },
  kicker: { fontSize: 12, color: "#8C8072", marginBottom: 4 },
  h1: { fontFamily: "'Source Serif Pro', Georgia, serif", fontSize: 24, fontWeight: 600, margin: "0 0 6px", color: "#2C271F" },
  sub: { fontSize: 13, color: "#6B5D4D", margin: "0 0 18px" },
  input: { width: "100%", border: "1px solid #E8E1D3", borderRadius: 7, padding: "10px 12px", fontSize: 14, marginBottom: 10, textAlign: "center" },
  error: { fontSize: 12, color: "#B4483F", marginBottom: 10 },
  btn: { width: "100%", border: "none", background: "#3A342B", color: "#F7F4EE", borderRadius: 7, padding: "10px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" },
};

const SOURCES = ["Referral - CA/CS", "Referral - Broker", "Content/YouTube", "Walk-in/Court", "Existing Client", "Other"];
const MATTER_TYPES = ["Criminal/Bail", "NI Act / Cheque Bounce", "Family/Matrimonial", "Property/Civil", "RERA", "Consumer", "Arbitration", "Corporate/Startup", "Other"];
const STATUSES = ["New", "Contacted", "Consultation Scheduled", "Retained", "Lost"];

const STATUS_STYLE = {
  "New": { bg: "#EFEAE1", fg: "#6B5D4D", dot: "#A99B85" },
  "Contacted": { bg: "#E4E9E4", fg: "#4C5D4C", dot: "#7C9A7C" },
  "Consultation Scheduled": { bg: "#E2E6EE", fg: "#3E4C6B", dot: "#6C81AD" },
  "Retained": { bg: "#DCE9DE", fg: "#2E5934", dot: "#4F8C5B" },
  "Lost": { bg: "#EFE1E1", fg: "#7A3D3D", dot: "#B87070" },
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => new Date().toISOString().slice(0, 10);

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}

function isOverdue(iso, done) {
  if (!iso || done) return false;
  return iso < todayISO();
}

function loadLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveLS(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function LeadDashboard() {
  const [leads, setLeads] = useState(() => loadLS("mj_leads", []));
  const [archived, setArchived] = useState(() => loadLS("mj_archived_leads", []));
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("All");
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [toast, setToast] = useState("");
  const [view, setView] = useState("active");

  useEffect(() => { saveLS("mj_leads", leads); }, [leads]);
  useEffect(() => { saveLS("mj_archived_leads", archived); }, [archived]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 1800);
  }

  function upsertLead(lead) {
    setLeads((prev) => {
      const exists = prev.some((l) => l.id === lead.id);
      if (exists) return prev.map((l) => (l.id === lead.id ? lead : l));
      return [lead, ...prev];
    });
  }

  function archiveLead(id) {
    setLeads((prev) => {
      const lead = prev.find((l) => l.id === id);
      if (lead) setArchived((a) => [{ ...lead, archivedOn: todayISO() }, ...a]);
      return prev.filter((l) => l.id !== id);
    });
    showToast("Lead archived");
  }

  function restoreLead(id) {
    setArchived((prev) => {
      const lead = prev.find((l) => l.id === id);
      if (lead) {
        const { archivedOn, ...rest } = lead;
        setLeads((l) => [rest, ...l]);
      }
      return prev.filter((l) => l.id !== id);
    });
    showToast("Lead restored");
  }

  function deletePermanently(id) {
    setArchived((prev) => prev.filter((l) => l.id !== id));
    showToast("Lead permanently deleted");
  }

  function toggleDone(id) {
    setLeads((prev) => prev.map((l) => (l.id === id ? { ...l, done: !l.done } : l)));
  }

  function cycleStatus(id) {
    setLeads((prev) =>
      prev.map((l) => {
        if (l.id !== id) return l;
        const idx = STATUSES.indexOf(l.status);
        const next = STATUSES[(idx + 1) % STATUSES.length];
        return { ...l, status: next };
      })
    );
  }

  const filtered = useMemo(() => {
    const source = view === "archive" ? archived : leads;
    return source
      .filter((l) => (view === "archive" ? true : statusFilter === "All" ? true : l.status === statusFilter))
      .filter((l) => {
        if (!query.trim()) return true;
        const q = query.toLowerCase();
        return (
          l.name.toLowerCase().includes(q) ||
          l.matter.toLowerCase().includes(q) ||
          l.source.toLowerCase().includes(q) ||
          (l.notes || "").toLowerCase().includes(q)
        );
      })
      .sort((a, b) => {
        if (view === "archive") return (b.archivedOn || "").localeCompare(a.archivedOn || "");
        const aOver = isOverdue(a.followUp, a.done) ? 0 : 1;
        const bOver = isOverdue(b.followUp, b.done) ? 0 : 1;
        if (aOver !== bOver) return aOver - bOver;
        return (b.created || "").localeCompare(a.created || "");
      });
  }, [leads, archived, query, statusFilter, view]);

  const stats = useMemo(() => {
    const total = leads.length;
    const active = leads.filter((l) => l.status !== "Retained" && l.status !== "Lost").length;
    const overdue = leads.filter((l) => isOverdue(l.followUp, l.done)).length;
    const retained = leads.filter((l) => l.status === "Retained").length;
    return { total, active, overdue, retained };
  }, [leads]);

  const editingLead = editingId ? leads.find((l) => l.id === editingId) : null;

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <div>
          <div style={styles.kicker}>Law Chambers of Mridul Jindal</div>
          <h1 style={styles.h1}>Lead Register</h1>
        </div>
        <div style={styles.headerActions}>
          <button style={styles.archiveToggle} onClick={() => setView(view === "archive" ? "active" : "archive")}>
            {view === "archive" ? "Back to leads" : `Archive${archived.length ? ` (${archived.length})` : ""}`}
          </button>
          {view === "active" && (
            <button style={styles.addBtn} onClick={() => { setEditingId(null); setShowForm(true); }}>
              + New lead
            </button>
          )}
        </div>
      </header>

      {view === "active" && (
        <React.Fragment>
          <div style={styles.statRow}>
            <StatBlock label="Total leads" value={stats.total} />
            <StatBlock label="In progress" value={stats.active} />
            <StatBlock label="Follow-ups overdue" value={stats.overdue} accent={stats.overdue > 0 ? "#B4483F" : undefined} />
            <StatBlock label="Retained" value={stats.retained} accent="#4F8C5B" />
          </div>

          <div style={styles.controls}>
            <div style={styles.searchWrap}>
              <input
                style={styles.searchInput}
                placeholder="Search name, matter, source, notes…"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
            </div>
            <div style={styles.filterPills}>
              {["All", ...STATUSES].map((s) => (
                <button
                  key={s}
                  onClick={() => setStatusFilter(s)}
                  style={{ ...styles.pill, ...(statusFilter === s ? styles.pillActive : {}) }}
                >
                  {s}
                </button>
              ))}
            </div>
          </div>
        </React.Fragment>
      )}

      {view === "archive" && (
        <div style={styles.controls}>
          <div style={styles.searchWrap}>
            <input
              style={styles.searchInput}
              placeholder="Search archived leads…"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
          </div>
        </div>
      )}

      <div style={styles.list}>
        {filtered.length === 0 && (
          <div style={styles.empty}>
            {view === "archive"
              ? "No archived leads."
              : leads.length === 0
              ? "No leads yet. Add your first one to start the register."
              : "Nothing matches this search or filter."}
          </div>
        )}
        {filtered.map((l) => {
          const st = STATUS_STYLE[l.status] || STATUS_STYLE["New"];
          const overdue = view === "active" && isOverdue(l.followUp, l.done);
          return (
            <div key={l.id} className="row-enter" style={{ ...styles.card, ...(overdue ? styles.cardOverdue : {}) }}>
              {view === "active" && (
                <button
                  aria-label={l.done ? "Mark follow-up pending" : "Mark follow-up done"}
                  onClick={() => toggleDone(l.id)}
                  style={{ ...styles.checkbox, ...(l.done ? styles.checkboxDone : {}) }}
                >
                  {l.done && <span style={{color:"#fff", fontSize:12, fontWeight:700}}>✓</span>}
                </button>
              )}

              <div
                style={styles.cardMain}
                onClick={() => { if (view === "active") { setEditingId(l.id); setShowForm(true); } }}
              >
                <div style={styles.cardTop}>
                  <span style={styles.leadName}>{l.name}</span>
                  {view === "active" ? (
                    <button
                      style={{ ...styles.statusChip, background: st.bg, color: st.fg }}
                      onClick={(e) => { e.stopPropagation(); cycleStatus(l.id); }}
                      title="Click to advance status"
                    >
                      <span style={{ ...styles.statusDot, background: st.dot }}></span>
                      {l.status}
                    </button>
                  ) : (
                    <span style={{ ...styles.statusChip, background: st.bg, color: st.fg }}>
                      <span style={{ ...styles.statusDot, background: st.dot }}></span>
                      {l.status}
                    </span>
                  )}
                </div>
                <div style={styles.cardMeta}>
                  <span>{l.matter}</span>
                  <span style={styles.metaDivider}>·</span>
                  <span>{l.source}</span>
                  {l.phone && (
                    <React.Fragment>
                      <span style={styles.metaDivider}>·</span>
                      <span>{l.phone}</span>
                    </React.Fragment>
                  )}
                </div>
                {view === "active" && l.followUp && (
                  <div style={{ ...styles.followUp, color: overdue ? "#B4483F" : "#8C8072" }}>
                    {overdue ? "Overdue — was due " : "Follow up "}
                    {fmtDate(l.followUp)}
                  </div>
                )}
                {view === "archive" && (
                  <div style={styles.followUp}>Archived {fmtDate(l.archivedOn)}</div>
                )}
                {l.notes && <div style={styles.notes}>{l.notes}</div>}
              </div>

              {view === "active" ? (
                <button aria-label="Archive lead" style={styles.deleteBtn} onClick={() => archiveLead(l.id)}>Archive</button>
              ) : (
                <div style={styles.archiveActions}>
                  <button aria-label="Restore lead" style={styles.restoreBtn} onClick={() => restoreLead(l.id)}>Restore</button>
                  <button aria-label="Delete permanently" style={styles.deleteBtn} onClick={() => deletePermanently(l.id)}>Delete</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {showForm && (
        <LeadForm
          lead={editingLead}
          onClose={() => { setShowForm(false); setEditingId(null); }}
          onSave={(lead) => { upsertLead(lead); setShowForm(false); setEditingId(null); showToast(editingLead ? "Lead updated" : "Lead added"); }}
        />
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

function StatBlock({ label, value, accent }) {
  return (
    <div style={styles.statBlock}>
      <div style={{ ...styles.statValue, color: accent || "#3A342B" }}>{value}</div>
      <div style={styles.statLabel}>{label}</div>
    </div>
  );
}

function LeadForm({ lead, onClose, onSave }) {
  const [name, setName] = useState(lead ? lead.name : "");
  const [phone, setPhone] = useState(lead ? lead.phone : "");
  const [source, setSource] = useState(lead ? lead.source : SOURCES[0]);
  const [matter, setMatter] = useState(lead ? lead.matter : MATTER_TYPES[0]);
  const [status, setStatus] = useState(lead ? lead.status : "New");
  const [followUp, setFollowUp] = useState(lead ? lead.followUp : "");
  const [notes, setNotes] = useState(lead ? lead.notes : "");

  function handleSubmit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    onSave({
      id: lead ? lead.id : uid(),
      name: name.trim(),
      phone: phone.trim(),
      source, matter, status, followUp,
      done: lead ? lead.done : false,
      notes: notes.trim(),
      created: lead ? lead.created : todayISO(),
    });
  }

  return (
    <div style={styles.overlay} onClick={onClose}>
      <form style={styles.modal} onClick={(e) => e.stopPropagation()} onSubmit={handleSubmit}>
        <div style={styles.modalHeader}>
          <h2 style={styles.modalTitle}>{lead ? "Edit lead" : "New lead"}</h2>
          <button type="button" style={styles.closeBtn} onClick={onClose}>✕</button>
        </div>

        <Field label="Name">
          <input style={styles.input} value={name} onChange={(e) => setName(e.target.value)} placeholder="Client or contact name" autoFocus />
        </Field>
        <Field label="Phone">
          <input style={styles.input} value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="98XXXXXXXX" />
        </Field>
        <div style={styles.fieldRow}>
          <Field label="Source">
            <Select value={source} onChange={setSource} options={SOURCES} />
          </Field>
          <Field label="Matter type">
            <Select value={matter} onChange={setMatter} options={MATTER_TYPES} />
          </Field>
        </div>
        <div style={styles.fieldRow}>
          <Field label="Status">
            <Select value={status} onChange={setStatus} options={STATUSES} />
          </Field>
          <Field label="Follow-up date">
            <input type="date" style={styles.input} value={followUp} onChange={(e) => setFollowUp(e.target.value)} />
          </Field>
        </div>
        <Field label="Notes">
          <textarea style={styles.textarea} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Matter details, amount, referral contact…" rows="3" />
        </Field>
        <div style={styles.modalActions}>
          <button type="button" style={styles.cancelBtn} onClick={onClose}>Cancel</button>
          <button type="submit" style={styles.saveBtn}>{lead ? "Save changes" : "Add lead"}</button>
        </div>
      </form>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div style={styles.field}>
      <label style={styles.label}>{label}</label>
      {children}
    </div>
  );
}

function Select({ value, onChange, options }) {
  return (
    <select style={styles.select} value={value} onChange={(e) => onChange(e.target.value)}>
      {options.map((o) => <option key={o} value={o}>{o}</option>)}
    </select>
  );
}

const FONT = "'Source Serif Pro', Georgia, 'Times New Roman', serif";
const SANS = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";

const styles = {
  page: { minHeight: "100vh", background: "#F7F4EE", fontFamily: SANS, color: "#3A342B", padding: "28px 20px 60px", maxWidth: 720, margin: "0 auto" },
  header: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 22, gap: 12, flexWrap: "wrap" },
  kicker: { fontSize: 12, letterSpacing: "0.02em", color: "#8C8072", marginBottom: 2 },
  h1: { fontFamily: FONT, fontSize: 28, fontWeight: 600, margin: 0, color: "#2C271F" },
  headerActions: { display: "flex", alignItems: "center", gap: 8 },
  addBtn: { background: "#3A342B", color: "#F7F4EE", border: "none", borderRadius: 8, padding: "9px 14px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" },
  archiveToggle: { background: "#fff", color: "#6B5D4D", border: "1px solid #E8E1D3", borderRadius: 8, padding: "9px 13px", fontSize: 13, fontWeight: 500, cursor: "pointer" },
  statRow: { display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 20 },
  statBlock: { background: "#FFFFFF", border: "1px solid #E8E1D3", borderRadius: 10, padding: "12px 10px", textAlign: "center" },
  statValue: { fontFamily: FONT, fontSize: 22, fontWeight: 600, lineHeight: 1.1 },
  statLabel: { fontSize: 10.5, color: "#8C8072", marginTop: 3 },
  controls: { marginBottom: 18 },
  searchWrap: { display: "flex", alignItems: "center", gap: 8, background: "#FFFFFF", border: "1px solid #E8E1D3", borderRadius: 8, padding: "9px 12px", marginBottom: 10 },
  searchInput: { border: "none", outline: "none", background: "transparent", fontSize: 13.5, flex: 1, color: "#3A342B", width: "100%" },
  filterPills: { display: "flex", gap: 6, flexWrap: "wrap" },
  pill: { border: "1px solid #E8E1D3", background: "#FFFFFF", color: "#6B5D4D", borderRadius: 999, padding: "5px 12px", fontSize: 12, cursor: "pointer" },
  pillActive: { background: "#3A342B", borderColor: "#3A342B", color: "#F7F4EE" },
  list: { display: "flex", flexDirection: "column", gap: 8 },
  empty: { textAlign: "center", color: "#8C8072", fontSize: 13.5, padding: "40px 0" },
  card: { display: "flex", gap: 10, background: "#FFFFFF", border: "1px solid #E8E1D3", borderRadius: 10, padding: "13px 12px", alignItems: "flex-start" },
  cardOverdue: { borderColor: "#E3B7B0", background: "#FDF7F6" },
  checkbox: { width: 20, height: 20, minWidth: 20, borderRadius: 6, border: "1.5px solid #C9BEA9", background: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", marginTop: 2 },
  checkboxDone: { background: "#4F8C5B", borderColor: "#4F8C5B" },
  cardMain: { flex: 1, cursor: "pointer", minWidth: 0 },
  cardTop: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" },
  leadName: { fontFamily: FONT, fontSize: 15.5, fontWeight: 600, color: "#2C271F" },
  statusChip: { display: "inline-flex", alignItems: "center", gap: 5, border: "none", borderRadius: 999, padding: "3px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" },
  statusDot: { width: 6, height: 6, borderRadius: "50%", display: "inline-block" },
  cardMeta: { fontSize: 12, color: "#8C8072", marginTop: 4, display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" },
  metaDivider: { color: "#D8CFBE" },
  followUp: { fontSize: 11.5, marginTop: 6, fontWeight: 500 },
  notes: { fontSize: 12.5, color: "#6B5D4D", marginTop: 6, lineHeight: 1.4 },
  deleteBtn: { border: "1px solid #E8E1D3", background: "#fff", color: "#8C8072", cursor: "pointer", padding: "5px 10px", borderRadius: 6, fontSize: 11.5, marginTop: 2 },
  archiveActions: { display: "flex", flexDirection: "column", gap: 4, marginTop: 2 },
  restoreBtn: { border: "1px solid #E8E1D3", background: "#fff", color: "#6B8C7C", cursor: "pointer", padding: "5px 10px", borderRadius: 6, fontSize: 11.5 },
  toast: { position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#3A342B", color: "#F7F4EE", padding: "9px 16px", borderRadius: 8, fontSize: 12.5 },
  overlay: { position: "fixed", inset: 0, background: "rgba(44, 39, 31, 0.4)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 50 },
  modal: { background: "#FFFFFF", borderRadius: 14, padding: 20, width: "100%", maxWidth: 420, maxHeight: "88vh", overflowY: "auto" },
  modalHeader: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 },
  modalTitle: { fontFamily: FONT, fontSize: 18, fontWeight: 600, margin: 0, color: "#2C271F" },
  closeBtn: { border: "none", background: "transparent", cursor: "pointer", color: "#8C8072", fontSize: 16, padding: 4 },
  field: { marginBottom: 12 },
  fieldRow: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 },
  label: { display: "block", fontSize: 11.5, color: "#8C8072", marginBottom: 5, fontWeight: 600 },
  input: { width: "100%", border: "1px solid #E8E1D3", borderRadius: 7, padding: "8px 10px", fontSize: 13.5, color: "#3A342B", background: "#FDFBF7" },
  select: { width: "100%", border: "1px solid #E8E1D3", borderRadius: 7, padding: "8px 10px", fontSize: 13.5, color: "#3A342B", background: "#FDFBF7", cursor: "pointer" },
  textarea: { width: "100%", border: "1px solid #E8E1D3", borderRadius: 7, padding: "8px 10px", fontSize: 13.5, color: "#3A342B", background: "#FDFBF7", resize: "vertical", fontFamily: SANS },
  modalActions: { display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 },
  cancelBtn: { border: "1px solid #E8E1D3", background: "#fff", color: "#6B5D4D", borderRadius: 7, padding: "8px 16px", fontSize: 13, cursor: "pointer" },
  saveBtn: { border: "none", background: "#3A342B", color: "#F7F4EE", borderRadius: 7, padding: "8px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer" },
};

function App() {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem("mj_unlocked") === "true");
  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
  return <LeadDashboard />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
